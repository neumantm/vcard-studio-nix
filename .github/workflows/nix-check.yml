name: "Test"
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Check Nix flake inputs
      uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
    - name: Install nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
    - name: Build
      env:
        NIXPKGS_ALLOW_UNFREE: 1
      run: nix build --impure
    - name: Flake Check
      env:
        NIXPKGS_ALLOW_UNFREE: 1
      run: nix flake check --impure --all-systems
